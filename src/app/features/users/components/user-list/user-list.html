<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th (click)="onSort('id')" class="sortable-header">
          ID
          <span [class]="`sort-icon ${getSortIcon('id')}`" aria-label="Sort by ID"></span>
        </th>
        <th (click)="onSort('firstName')" class="sortable-header">
          First Name
          <span [class]="`sort-icon ${getSortIcon('firstName')}`" aria-label="Sort by First Name"></span>
        </th>
        <th (click)="onSort('lastName')" class="sortable-header">
          Last Name
          <span [class]="`sort-icon ${getSortIcon('lastName')}`" aria-label="Sort by Last Name"></span>
        </th>
        <th (click)="onSort('createdAt')" class="sortable-header">
          Created At
          <span [class]="`sort-icon ${getSortIcon('createdAt')}`" aria-label="Sort by Created At"></span>
        </th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr (click)="onUserSelect(user)" class="clickable-row">
          <td class="position-relative">
            {{ user.id }}
            @if (isNewUser(user)) {
              <span class="badge bg-success new-user-badge">New User</span>
            }
          </td>
          <td>{{ user.firstName }}</td>
          <td>{{ user.lastName }}</td>
          <td>{{ formatDate(user.createdAt) }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
