<nav aria-label="User pagination">
  <div class="d-flex justify-content-between align-items-center">
    <button (click)="onPrevious()" [disabled]="!canGoPrevious()" class="btn btn-outline-primary">
      Previous
    </button>
    <div class="d-flex align-items-center">
      <span class="fw-bold me-3"> Page {{ currentPage() + 1 }} of {{ totalPages() }} </span>
      <span class="fw-bold me-3">
        Showing {{ paginatedItems().length }} of {{ allItems().length }} items
      </span>
      <div class="d-flex align-items-center">
        <label for="itemsPerPage" class="form-label me-2 mb-0">Items per page:</label>
        <select
          id="itemsPerPage"
          class="form-select pagination-select"
          [value]="itemsPerPage()"
          (change)="onItemsPerPageChange($event)"
        >
          @for (option of paginationOptions; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
      </div>
    </div>
    <button (click)="onNext()" [disabled]="!canGoNext()" class="btn btn-outline-primary">
      Next
    </button>
  </div>
</nav>
